# SVJ MART - Application Configuration
spring.application.name=svj-mart
server.port=${PORT:8080}
server.servlet.context-path=/

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Session and Buffer Configuration
server.servlet.session.tracking-modes=cookie
server.tomcat.resource.buffer-size=65536
spring.session.store-type=none

# Database Configuration (Defaults to persistent H2 file, or auto-configures via cloud environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/svjmartdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Alternative MySQL Configuration (Uncomment for Production Deployment)
# spring.datasource.url=jdbc:mysql://localhost:3306/svjmart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
