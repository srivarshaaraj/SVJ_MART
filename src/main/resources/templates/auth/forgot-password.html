<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password &bull; SVJ MART</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: linear-gradient(180deg, #6078EA 0%, #4D5CD4 40%, #5C3FB2 100%);
            color: #172033;
        }

        .top-nav {
            width: 100%;
            max-width: 440px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .card-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 28px;
            padding: 36px 32px 32px;
            box-shadow: 0 25px 60px rgba(18, 24, 76, 0.32);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #EEF2FF;
            color: #3B5CE8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 14px;
        }

        .page-title {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 6px;
        }

        .page-subtitle {
            font-size: 0.9rem;
            color: #64748B;
            line-height: 1.45;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.92rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 48px;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 0.95rem;
            color: #1E293B;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input:focus {
            border-color: #3B5CE8;
            box-shadow: 0 0 0 3px rgba(59, 92, 232, 0.15);
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #5B72EA 0%, #4D5CD4 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(91, 114, 234, 0.38);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(91, 114, 234, 0.45);
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.92rem;
            color: #64748B;
        }

        .footer-link {
            color: #3B5CE8;
            font-weight: 700;
            text-decoration: none;
            margin-left: 4px;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        .alert-box {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            margin-bottom: 18px;
        }

        .alert-box.alert-success {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #86EFAC;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a th:href="@{/login}" class="back-link">
            <i class="bi bi-arrow-left"></i> Back to Login
        </a>
        <a th:href="@{/}" class="back-link">
            Storefront
        </a>
    </div>

    <div class="card-container">
        <div class="brand-header">
            <div class="icon-circle">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h1 class="page-title">Reset Password</h1>
            <p class="page-subtitle">
                Enter your registered email address and we will send you secure recovery instructions.
            </p>
        </div>

        <div th:if="${successMessage != null}" class="alert-box alert-success">
            <i class="bi bi-check-circle-fill me-1"></i>
            <span th:text="${successMessage}">Password reset link sent!</span>
        </div>

        <form th:action="@{/forgot-password}" method="POST">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input"
                       placeholder="Enter your registered email" required autofocus>
            </div>

            <button type="submit" class="submit-btn">
                Send Reset Link
            </button>
        </form>

        <div class="footer-text">
            <span>Remember your password?</span>
            <a th:href="@{/login}" class="footer-link">Sign In</a>
        </div>
    </div>

</body>
</html>
