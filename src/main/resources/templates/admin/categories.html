<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Category Management')}"></head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container-fluid px-3 px-lg-5 py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-tags text-primary me-2"></i> Supermarket Aisles & Categories</h2>
            <p class="text-muted small mb-0">Organize and toggle visibility for the 16 core Indian supermarket aisles</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm fw-semibold">Back to Admin</a>
    </div>

    <div class="row g-4">
        <!-- Add Category Form -->
        <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm p-4" style="border-radius: 16px;">
                <h5 class="fw-bold mb-3 pb-2 border-bottom">Create / Update Aisle</h5>
                <form th:action="@{/admin/categories/save}" th:object="${newCategory}" method="POST">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Category Name *</label>
                        <input type="text" th:field="*{name}" class="form-control form-control-sm" placeholder="e.g. Organic Pulses" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Slug (URL)</label>
                        <input type="text" th:field="*{slug}" class="form-control form-control-sm" placeholder="organic-pulses (auto-generated if empty)">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Bootstrap Icon Class</label>
                        <input type="text" th:field="*{icon}" class="form-control form-control-sm" placeholder="e.g. bi-basket">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Display Order</label>
                        <input type="number" th:field="*{displayOrder}" class="form-control form-control-sm" value="0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Aisle Description</label>
                        <textarea th:field="*{description}" rows="3" class="form-control form-control-sm" placeholder="Pantry staples description..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm w-100 py-2 fw-semibold">
                        Save Category
                    </button>
                </form>
            </div>
        </div>

        <!-- Categories Table -->
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm p-4" style="border-radius: 16px;">
                <h5 class="fw-bold mb-3 pb-2 border-bottom">Active Supermarket Aisles</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light extra-small text-uppercase text-secondary">
                            <tr>
                                <th>Order</th>
                                <th>Aisle Name</th>
                                <th>Slug</th>
                                <th>Icon</th>
                                <th>Status</th>
                                <th class="text-end">Toggle Visibility</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${categories}">
                                <td class="font-monospace small fw-bold" th:text="${c.displayOrder}">1</td>
                                <td>
                                    <strong class="text-dark small d-block" th:text="${c.name}">Name</strong>
                                    <span class="extra-small text-muted" th:text="${c.description}">Desc</span>
                                </td>
                                <td class="font-monospace extra-small text-muted" th:text="${c.slug}">slug</td>
                                <td>
                                    <i class="bi text-primary fs-5" th:classappend="${c.icon != null ? c.icon : 'bi-bag'}"></i>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${c.active ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'}"
                                          th:text="${c.active ? 'Visible' : 'Hidden'}">Visible</span>
                                </td>
                                <td class="text-end">
                                    <form th:action="@{'/admin/categories/toggle/' + ${c.id}}" method="POST" class="m-0">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary py-1 px-2">
                                            <i class="bi" th:classappend="${c.active ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
