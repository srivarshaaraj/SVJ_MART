<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Seller Management')}"></head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container-fluid px-3 px-lg-5 py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-shop-window text-primary me-2"></i> Seller Approval & Governance</h2>
            <p class="text-muted small mb-0">Review vendor applications, verify GSTIN details, and grant supermarket listing permissions</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm fw-semibold">Back to Admin</a>
    </div>

    <div class="card border-0 shadow-sm p-4" style="border-radius: 16px;">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light extra-small text-uppercase text-secondary">
                    <tr>
                        <th>Store Name</th>
                        <th>Owner Account</th>
                        <th>GSTIN</th>
                        <th>Business Description</th>
                        <th>Status</th>
                        <th>Approval Date</th>
                        <th class="text-end">Verification Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${sellers}">
                        <td>
                            <strong class="text-dark small d-block" th:text="${s.storeName}">Store Name</strong>
                            <span class="extra-small text-muted" th:text="'Profile #' + ${s.id}">#1</span>
                        </td>
                        <td>
                            <div class="small fw-semibold text-dark" th:text="${s.user != null ? s.user.name : '-'}">User</div>
                            <div class="extra-small text-muted" th:text="${s.user != null ? s.user.email : '-'}">Email</div>
                        </td>
                        <td class="font-monospace small text-muted" th:text="${s.gstin != null && !s.gstin.isEmpty() ? s.gstin : 'Not Provided'}">GSTIN</td>
                        <td class="small text-muted" style="max-width: 250px;" th:text="${s.businessDescription != null ? s.businessDescription : 'General retail merchandise'}">Desc</td>
                        <td>
                            <span class="badge py-2 px-3 small"
                                  th:classappend="${s.approved ? 'bg-success bg-opacity-10 text-success' : 'bg-warning bg-opacity-25 text-dark'}"
                                  th:text="${s.approved ? 'Approved Vendor' : 'Pending Approval'}">Pending</span>
                        </td>
                        <td class="extra-small text-muted" th:text="${s.approvedAt != null ? #temporals.format(s.approvedAt, 'dd MMM yyyy') : 'Awaiting Review'}">Date</td>
                        <td class="text-end">
                            <div class="d-flex align-items-center justify-content-end gap-2">
                                <form th:action="@{'/admin/sellers/approve/' + ${s.id}}" method="POST" class="m-0" th:if="${!s.approved}">
                                    <button type="submit" class="btn btn-sm btn-success px-3 fw-semibold">
                                        <i class="bi bi-check-lg me-1"></i> Approve
                                    </button>
                                </form>
                                <form th:action="@{'/admin/sellers/suspend/' + ${s.id}}" method="POST" class="m-0" th:if="${s.approved}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger px-3 fw-semibold"
                                            onsubmit="return confirm('Suspend this vendor from selling?');">
                                        <i class="bi bi-slash-circle me-1"></i> Suspend
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
