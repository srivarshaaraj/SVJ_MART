<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Coupon Management')}"></head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container-fluid px-3 px-lg-5 py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-ticket-perforated text-primary me-2"></i> Promotional Coupons</h2>
            <p class="text-muted small mb-0">Create and manage checkout discount codes, flat cashbacks, and percentage caps</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm fw-semibold">Back to Admin</a>
    </div>

    <div class="row g-4">
        <!-- Create Coupon Form -->
        <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm p-4" style="border-radius: 16px;">
                <h5 class="fw-bold mb-3 pb-2 border-bottom">Create Promotional Voucher</h5>

                <form th:action="@{/admin/coupons/save}" th:object="${newCoupon}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Coupon Code *</label>
                        <input type="text" th:field="*{code}" class="form-control form-control-sm text-uppercase" placeholder="e.g. FESTIVE20" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label extra-small fw-semibold">Discount %</label>
                            <input type="number" th:field="*{discountPercent}" class="form-control form-control-sm" placeholder="15" min="0" max="100">
                        </div>
                        <div class="col-6">
                            <label class="form-label extra-small fw-semibold">Flat Discount (&#8377;)</label>
                            <input type="number" step="0.50" th:field="*{flatDiscount}" class="form-control form-control-sm" placeholder="50.00" min="0">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label extra-small fw-semibold">Min Order (&#8377;)</label>
                            <input type="number" step="0.50" th:field="*{minOrderValue}" class="form-control form-control-sm" placeholder="499.00">
                        </div>
                        <div class="col-6">
                            <label class="form-label extra-small fw-semibold">Max Cap (&#8377;)</label>
                            <input type="number" step="0.50" th:field="*{maxDiscount}" class="form-control form-control-sm" placeholder="150.00">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm w-100 py-2 fw-semibold">
                        Publish Voucher
                    </button>
                </form>
            </div>
        </div>

        <!-- Coupons Table -->
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm p-4" style="border-radius: 16px;">
                <h5 class="fw-bold mb-3 pb-2 border-bottom">Active Promotional Codes</h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light extra-small text-uppercase text-secondary">
                            <tr>
                                <th>Code</th>
                                <th>Discount</th>
                                <th>Min Order</th>
                                <th>Max Cap</th>
                                <th>Status</th>
                                <th class="text-end">Toggle</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${coupons}">
                                <td>
                                    <strong class="font-monospace text-primary fs-6" th:text="${c.code}">WELCOME50</strong>
                                </td>
                                <td class="small fw-semibold text-dark">
                                    <span th:if="${c.discountPercent > 0}" th:text="${c.discountPercent} + '% OFF'">15% OFF</span>
                                    <span th:unless="${c.discountPercent > 0}" th:text="'&#8377;' + ${c.flatDiscount} + ' Flat'">&#8377;50 Flat</span>
                                </td>
                                <td class="font-monospace small text-muted" th:text="'&#8377;' + ${c.minOrderValue}">&#8377;499</td>
                                <td class="font-monospace small text-muted" th:text="${c.maxDiscount != null ? '&#8377;' + c.maxDiscount : 'No Limit'}">Limit</td>
                                <td>
                                    <span class="badge" th:classappend="${c.active ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'}"
                                          th:text="${c.active ? 'Active' : 'Disabled'}">Active</span>
                                </td>
                                <td class="text-end">
                                    <form th:action="@{'/admin/coupons/toggle/' + ${c.id}}" method="POST" class="m-0">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary py-1 px-2">
                                            <i class="bi" th:classappend="${c.active ? 'bi-toggle-on text-success' : 'bi-toggle-off text-muted'}"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
