<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('User Management')}"></head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container-fluid px-3 px-lg-5 py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-people text-primary me-2"></i> User Accounts</h2>
            <p class="text-muted small mb-0">Manage registered buyers, supermarket sellers, and administrators</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm fw-semibold">Back to Admin</a>
    </div>

    <div class="card border-0 shadow-sm p-4" style="border-radius: 16px;">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light extra-small text-uppercase text-secondary">
                    <tr>
                        <th>ID</th>
                        <th>User Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Registered Date</th>
                        <th class="text-end">Account Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="font-monospace small text-muted" th:text="'#' + ${u.id}">#1</td>
                        <td class="fw-semibold text-dark small" th:text="${u.name}">User Name</td>
                        <td class="small text-muted" th:text="${u.email}">user@example.com</td>
                        <td class="small text-muted" th:text="${u.phone}">9876543210</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.role.name() == 'ROLE_ADMIN' ? 'bg-danger' : (u.role.name() == 'ROLE_SELLER' ? 'bg-primary' : 'bg-success')}"
                                  th:text="${#strings.replace(u.role.name(), 'ROLE_', '')}">BUYER</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.enabled ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'}"
                                  th:text="${u.enabled ? 'Active' : 'Suspended'}">Active</span>
                        </td>
                        <td class="extra-small text-muted" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">Date</td>
                        <td class="text-end">
                            <form th:action="@{'/admin/users/toggle-status/' + ${u.id}}" method="POST" class="m-0"
                                  th:if="${u.role.name() != 'ROLE_ADMIN'}">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${u.enabled ? 'btn-outline-danger' : 'btn-outline-success'}"
                                        th:text="${u.enabled ? 'Suspend' : 'Activate'}">
                                    Toggle
                                </button>
                            </form>
                            <span th:if="${u.role.name() == 'ROLE_ADMIN'}" class="extra-small text-muted">Protected Admin</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
