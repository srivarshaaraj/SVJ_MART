<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Catalogue Oversight')}"></head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container-fluid px-3 px-lg-5 py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-box-seam text-primary me-2"></i> Supermarket Product Catalogue</h2>
            <p class="text-muted small mb-0">Monitor all product listings across vendor accounts and store aisles</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm fw-semibold">Back to Admin</a>
    </div>

    <div class="card border-0 shadow-sm p-4" style="border-radius: 16px;">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light extra-small text-uppercase text-secondary">
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Brand</th>
                        <th>Category</th>
                        <th>Seller</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Rating</th>
                        <th>Status</th>
                        <th class="text-end">View</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td class="font-monospace small text-muted" th:text="'#' + ${p.id}">#1</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img th:src="${p.imageUrl != null and !p.imageUrl.isEmpty() ? p.imageUrl : '/images/placeholder-product.svg'}"
                                     onerror="this.src='/images/placeholder-product.svg'"
                                     style="width: 36px; height: 36px; object-fit: contain; border-radius: 4px; background: #fff;"
                                     th:alt="${p.name}">
                                <div>
                                    <a th:href="@{'/product/' + ${p.id}}" class="fw-semibold text-dark text-decoration-none small d-block" th:text="${p.name}">Product Name</a>
                                    <span class="extra-small text-muted" th:text="${p.packageSize}">1 kg</span>
                                </div>
                            </div>
                        </td>
                        <td class="small fw-semibold text-secondary" th:text="${p.brand}">Brand</td>
                        <td class="small text-muted" th:text="${p.category != null ? p.category.name : '-'}">Category</td>
                        <td class="small text-muted" th:text="${p.seller != null ? p.seller.name : 'Store'}">Seller</td>
                        <td class="font-monospace fw-bold small text-dark" th:text="'&#8377;' + ${p.price}">&#8377;100</td>
                        <td>
                            <span class="badge" th:classappend="${p.stockQuantity <= 10 ? 'bg-danger' : 'bg-light text-dark border'}"
                                  th:text="${p.stockQuantity} + ' units'">20 units</span>
                        </td>
                        <td class="small">
                            <span class="text-warning"><i class="bi bi-star-fill"></i></span>
                            <span th:text="${p.averageRating}">4.5</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${p.inStock ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'}"
                                  th:text="${p.inStock ? 'In Stock' : 'Out of Stock'}">In Stock</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/product/' + ${p.id}}" class="btn btn-sm btn-outline-primary py-1 px-2">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
